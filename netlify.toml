# Hosting for the demo page. The page itself is prebuilt and committed; the only thing
# Netlify builds is the one server function that talks to the model.
[build]
  base = "app"
  publish = "site"
  command = "echo 'site is prebuilt'"
  # Deploy only when the page or the function changes (paths are relative to base): each production
  # deploy uses plan credits.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
