name: extra-evals
# Evaluations added after the held-out test, kept separate from it (results/runs/test-* are not touched):
# fresh contract-end scenarios (frozen agent vs the agent with the policy check) and difficult customers.
on:
  workflow_dispatch:
    inputs:
      parts: {description: "any of: contract difficult scripted ablation", default: "scripted ablation"}
      model: {default: "anthropic/claude-haiku-4-5-20251001"}
      ablation_trials: {description: "attempts per call for the ablation", default: "1"}
      ablation_suffix: {description: "run-id suffix for extra ablation attempts (e.g. -t2)", default: ""}
      seed: {default: "300"}
permissions:
  contents: write
env:
  TAU2_COMMIT: 4ce7c0397c1eb65c9bbe59aeacfe1ca44a1cd699
  # the 8 contract-end tasks in the benchmark's full set that are in neither the development nor the test split
  FRESH: >-
    [service_issue]contract_end_suspension[PERSONA:Hard]
    [service_issue]airplane_mode_on|contract_end_suspension[PERSONA:Easy]
    [service_issue]break_apn_settings|contract_end_suspension[PERSONA:Easy]
    [service_issue]airplane_mode_on|contract_end_suspension|unseat_sim_card[PERSONA:Hard]
    [service_issue]airplane_mode_on|contract_end_suspension|lock_sim_card_pin[PERSONA:Hard]
    [service_issue]airplane_mode_on|break_apn_settings|contract_end_suspension[PERSONA:Easy]
    [service_issue]contract_end_suspension|lock_sim_card_pin|unseat_sim_card[PERSONA:Easy]
    [service_issue]break_apn_settings|contract_end_suspension|unseat_sim_card[PERSONA:None]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Get the benchmark at a pinned version
        run: |
          git clone https://github.com/sierra-research/tau2-bench.git
          git -C tau2-bench checkout "$TAU2_COMMIT"
          cd tau2-bench && uv sync && uv pip install websockets
      - run: test -n "$ANTHROPIC_API_KEY" || { echo "ANTHROPIC_API_KEY secret is not set"; exit 1; }
      - name: Run
        working-directory: tau2-bench
        run: |
          set -f   # task ids contain [ ] characters
          ARGS='{"temperature": 0.0, "cache_control_injection_points": [{"location": "message", "role": "system"}, {"location": "message", "index": -1}]}'
          run() {  # run_id agent extra-args...
            id=$1; agent=$2; shift 2
            uv run python ../scripts/run.py run --domain telecom --agent "$agent" \
              --agent-llm "${{ inputs.model }}" --user-llm "${{ inputs.model }}" --num-trials "${TRIALS:-1}" --seed "${{ inputs.seed }}" \
              --max-concurrency 4 --timeout 1200 --agent-llm-args "$ARGS" --user-llm-args "$ARGS" --save-to "$id" "$@" || true
            src="data/simulations/$id/results.json"; out="../results/runs/$id"
            if [ -f "$src" ]; then python ../scripts/summarize.py "$src" "$out" | head -20; gzip -9 -c "$src" > "$out/results.json.gz"; fi
          }
          if [[ "${{ inputs.parts }}" == *contract* ]]; then
            for a in lineassist lineassist_v2; do run fresh-contract-$a $a --task-split-name full --task-ids $FRESH; done
          fi
          if [[ "${{ inputs.parts }}" == *difficult* ]]; then
            run difficult-lineassist_v2 lineassist_v2 --task-set-name telecom_difficult
            run difficult-baseline llm_agent --task-set-name telecom_difficult
          fi
          if [[ "${{ inputs.parts }}" == *scripted* ]]; then
            run scripted-lineassist_v2 lineassist_v2 --task-set-name telecom_scripted --user scripted_user
            run scripted-baseline llm_agent --task-set-name telecom_scripted --user scripted_user
          fi
          if [[ "${{ inputs.parts }}" == *ablation* ]]; then
            mapfile -t ABL < ../results/ablation_tasks.txt
            for a in lineassist_no_guard lineassist_no_line_check lineassist_no_case_notes lineassist_no_playbook; do
              TRIALS="${{ inputs.ablation_trials }}" run ablation-$a${{ inputs.ablation_suffix }} $a --task-split-name test --task-ids "${ABL[@]}"
            done
          fi
      - name: Score and save
        if: always()
        run: |
          python scripts/analyze_extra.py \
            --contract lineassist=results/runs/fresh-contract-lineassist lineassist_v2=results/runs/fresh-contract-lineassist_v2 \
            --difficult lineassist_v2=results/runs/difficult-lineassist_v2 standard=results/runs/difficult-baseline \
            --scripted lineassist_v2=results/runs/scripted-lineassist_v2 standard=results/runs/scripted-baseline \
            --ablation no_guard=results/runs/ablation-lineassist_no_guard,results/runs/ablation-lineassist_no_guard-t2 \
                       no_line_check=results/runs/ablation-lineassist_no_line_check,results/runs/ablation-lineassist_no_line_check-t2 \
                       no_case_notes=results/runs/ablation-lineassist_no_case_notes,results/runs/ablation-lineassist_no_case_notes-t2 \
                       no_playbook=results/runs/ablation-lineassist_no_playbook,results/runs/ablation-lineassist_no_playbook-t2 \
            --out results/extra_evals.json || true
          git config user.name "Divya Sri"
          git config user.email "hellosweety789@gmail.com"
          git add results/
          git commit -m "Extra evaluations: ${{ inputs.parts }}" || exit 0
          git pull --rebase && git push
